services:
  # Backend Service (FastAPI)
  - type: web
    name: cropiq-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cropiq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: cropiq-db
    databaseName: cropiq
    user: postgres
    plan: free # Change to 'starter' for production
